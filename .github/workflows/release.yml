name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build App with Tauri CLI
        run: pnpm tauri build --bundles nsis

      - name: List built files for debugging
        run: Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*.exe" | Select-Object FullName

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vuoom-Windows-Exe
          path: src-tauri/target/**/*.exe

      - name: Publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.39-${{ github.run_number }}
          releaseName: 'Vuoom v0.1.39 (Build #${{ github.run_number }})'
          releaseBody: 'Download the custom Vuoom Windows setup exe below.'
          releaseDraft: false
          prerelease: false
